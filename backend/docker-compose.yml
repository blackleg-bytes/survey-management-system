services:
  # ================================
  # NestJS Application
  # ================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: server
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - APP_PORT=3000
      - APP_TIMEOUT=${APP_TIMEOUT:-30000}
      - APP_CORS_ORIGINS=${APP_CORS_ORIGINS:-http://localhost:3001}
      - DATABASE_URL=postgres://postgres:postgres@db:5432/survey-db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - survey-network

  # ================================
  # PostgreSQL Database
  # ================================
  db:
    image: postgres:16-alpine
    container_name: database
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=survey-db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - survey-network

# ================================
# Volumes
# ================================
volumes:
  postgres_data:

# ================================
# Networks
# ================================
networks:
  survey-network:
    driver: bridge
